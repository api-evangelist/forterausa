name: Fortera
description: >-
  Fortera is a Silicon Valley materials-technology company advancing zero-CO2 cement.
  Its ReCarb process economically converts captured CO2 into ReAct green cement that
  meets regulatory standards and can be blended with or used in place of Ordinary
  Portland Cement inside existing production infrastructure. Fortera operates its first
  commercial ReCarb plant in Redding, California, holds 100+ patents, and is backed by
  Khosla Ventures and Temasek. The company is a climate-tech materials producer rather
  than a software/API provider; it publishes a public marketing website and an
  llms.txt but no developer API surface.
